[workspace]
resolver = "3"
members = ["crates/rom-core", "crates/rom-gui"]

[workspace.package]
version = "2.0.0"
edition = "2024"

[workspace.dependencies]
rom-core = { path = "crates/rom-core" }
thiserror = "2"
eframe = "0.37"
rust-i18n = "4"
rusqlite = { version = "0.40", features = ["bundled"] }
dirs = "7"
tempfile = "3"
open = "5"
ureq = "3"
semver = "1"
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
sevenz-rust2 = "0.24"
tar = "0.4"
rfd = "0.17"
